<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Para ti</title>
  <meta name="theme-color" content="#150d18">
  <meta property="og:title" content="Para ti">
  <meta property="og:description" content="Un pequeño lugar hecho solo para ti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ===== Fondo de corazones ===== -->
  <div class="corazones" id="corazones" aria-hidden="true"></div>

  <!-- ===== Pantalla del sobre ===== -->
  <div class="sobre-pantalla" id="sobrePantalla">
    <div class="sobre-contenido">
      <p class="sobre-para" id="sobrePara">Para ti</p>

      <button class="sobre" id="sobreBtn" aria-label="Abrir la carta">
        <svg viewBox="0 0 200 140" class="sobre-svg" aria-hidden="true">
          <!-- cuerpo -->
          <rect x="4" y="24" width="192" height="112" rx="10" class="s-cuerpo"/>
          <!-- carta que asoma -->
          <rect x="30" y="8" width="140" height="92" rx="6" class="s-carta" id="sCarta"/>
          <line x1="48" y1="34" x2="152" y2="34" class="s-linea"/>
          <line x1="48" y1="50" x2="152" y2="50" class="s-linea"/>
          <line x1="48" y1="66" x2="120" y2="66" class="s-linea"/>
          <!-- solapas laterales -->
          <path d="M4 34 L100 104 L196 34 L196 126 Q196 136 186 136 L14 136 Q4 136 4 126 Z" class="s-frente"/>
          <!-- solapa superior -->
          <path d="M4 34 Q4 24 14 24 L186 24 Q196 24 196 34 L100 104 Z" class="s-solapa" id="sSolapa"/>
        </svg>
        <span class="sello" id="sello">♥</span>
      </button>

      <p class="sobre-toca">toca para abrir</p>
    </div>
  </div>

  <!-- ===== Contenido ===== -->
  <main class="pagina" id="pagina" hidden>

    <!-- Portada -->
    <header class="hero">
      <p class="hero-kicker" id="heroKicker">feliz aniversario</p>
      <h1 class="hero-nombre" id="heroNombre">Mi amor</h1>
      <p class="hero-frase" id="heroFrase"></p>
      <div class="hero-scroll" aria-hidden="true"><span></span></div>
    </header>

    <!-- Contador -->
    <section class="bloque revelar" id="secContador">
      <p class="bloque-titulo" id="contadorTitulo">Juntos desde hace</p>
      <div class="contador" id="contador">
        <div class="c-item"><b data-c="anios">0</b><span>años</span></div>
        <div class="c-item"><b data-c="meses">0</b><span>meses</span></div>
        <div class="c-item"><b data-c="dias">0</b><span>días</span></div>
        <div class="c-item"><b data-c="horas">0</b><span>horas</span></div>
        <div class="c-item"><b data-c="minutos">0</b><span>min</span></div>
        <div class="c-item"><b data-c="segundos">0</b><span>seg</span></div>
      </div>
      <p class="contador-pie" id="contadorPie"></p>
    </section>

    <!-- Frases -->
    <section class="bloque frases revelar" id="secFrases">
      <div class="comilla" aria-hidden="true">“</div>
      <p class="frase" id="frase" aria-live="polite"></p>
      <div class="puntos" id="puntos"></div>
    </section>

    <!-- Galería -->
    <section class="bloque revelar" id="secGaleria">
      <p class="bloque-titulo" id="galeriaTitulo">Nosotros</p>
      <p class="bloque-sub" id="galeriaSub">toca una foto para verla en grande</p>
      <div class="galeria" id="galeria"></div>
    </section>

    <!-- Carta -->
    <section class="bloque carta revelar" id="secCarta">
      <h2 id="cartaTitulo"></h2>
      <div id="cartaCuerpo"></div>
      <p class="firma" id="cartaFirma"></p>
    </section>

    <footer class="pie">
      <span class="pie-corazon" aria-hidden="true">♥</span>
      <p id="pieTexto"></p>
    </footer>
  </main>

  <!-- ===== Visor de fotos ===== -->
  <div class="visor" id="visor" hidden>
    <button class="visor-cerrar" id="visorCerrar" aria-label="Cerrar">×</button>
    <button class="visor-nav visor-prev" id="visorPrev" aria-label="Anterior">‹</button>
    <button class="visor-nav visor-sig" id="visorSig" aria-label="Siguiente">›</button>
    <figure class="visor-figura">
      <img id="visorImg" alt="">
      <figcaption id="visorPie"></figcaption>
    </figure>
  </div>

  <!-- ===== Música ===== -->
  <button class="musica-btn" id="musicaBtn" hidden aria-label="Música">
    <span id="musicaIcono">♪</span>
  </button>
  <audio id="audio" loop preload="none"></audio>

  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
